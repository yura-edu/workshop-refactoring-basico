# yura.workshop.yaml — declarative grader config
# Spec: docs/grader-workers-spec.md §6
# Generated from prisma/seeds/workshop-templates.seed.ts

schema_version: "1.0"
workshop:
  id: refactoring-basico
  title: "Refactoring Guiado"
  type: refactoring
  language: typescript
  passing_threshold: 70
  base_branch: main
submission:
  source: workshop_link
  required_inputs:
    - type: github_repo_url
      label: "URL del repositorio"
      required: true
evaluation_profile:
  - metric_id: cyclomatic_complexity
    weight: 35
    threshold: 10
    config:
      tool: eslint-complexity
      max_per_function: 10
      aggregation: avg
      include_paths:
        - src/
      exclude_paths:
        - tests/
        - "**/__init__.py"
        - "**/*.test.ts"
        - "**/*.spec.ts"
      timeout_seconds: 120
  - metric_id: code_duplication
    weight: 35
    threshold: 0.03
    config:
      tool: jscpd
      min_tokens: 50
      min_lines: 5
      max_duplication_percent: 3
      ignore_paths:
        - dist/
        - build/
        - "**/__pycache__/**"
  - metric_id: loc_delta
    weight: 30
    threshold: -50
    config:
      base_ref: origin/main
      tool: git_diff
      max_added_lines: null
      count_extensions:
        - .ts
        - .tsx
        - .js
        - .jsx
